<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fisioneo - Modo Offline</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #f0f9ff 0%, #f7fafc 100%);
      color: #333;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .container {
      max-width: 500px;
      padding: 2rem;
      background-color: white;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      margin: 1rem;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(to right, #6EC1E4, #B9A9FF);
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #333;
    }
    p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .cached-content {
      background-color: #f8fafc;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-top: 1.5rem;
      text-align: left;
    }
    .cached-content h2 {
      font-size: 1rem;
      margin-top: 0;
      color: #555;
    }
    .cached-content ul {
      padding-left: 1.5rem;
      margin-bottom: 0;
    }
    .cached-content li {
      margin-bottom: 0.5rem;
    }
    .cached-content a {
      color: #6EC1E4;
      text-decoration: none;
    }
    .status-icon {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .reconnect-btn {
      background: linear-gradient(to right, #6EC1E4, #B9A9FF);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 2rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .reconnect-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="22"></line>
      </svg>
    </div>
    <div class="status-icon">📶</div>
    <h1>Você está offline</h1>
    <p>Não foi possível conectar à internet. Verifique sua conexão e tente novamente.</p>
    <button class="reconnect-btn" onclick="window.location.reload()">Tentar novamente</button>
    
    <div class="cached-content">
      <h2>Conteúdo disponível offline:</h2>
      <ul>
        <li><a href="/provas">Provas</a></li>
        <li><a href="/prova-neo">Prova Neonatal</a></li>
        <li><a href="/prova-ped">Prova Pediátrica</a></li>
        <li><a href="/temas">Temas</a></li>
      </ul>
    </div>
  </div>

  <script>
    // Verificar periodicamente a conexão
    setInterval(() => {
      if (navigator.onLine) {
        document.querySelector('.status-icon').textContent = '✅';
      } else {
        document.querySelector('.status-icon').textContent = '📶';
      }
    }, 5000);
  </script>
</body>
</html>
